function listaCfg(lista,titulo,sub,ro){
  const itens=S.cfg[lista]||[];
  let h=`<div class="card"><h2>${titulo}</h2><p class="sub">${sub}</p><div class="list">`;
  if(!itens.length)h+='<div class="li"><span class="empty" style="padding:0">Nenhum cadastrado.</span></div>';
  itens.forEach((x,i)=>{
    h+=`<div class="li ${x.ativo?'':'off'}"><i class="dot" style="background:${lista==='origens'?'var(--c2)':corIdx(i)}"></i><input type="text" value="${esc(x.nome)}" data-ren="${lista}:${esc(x.id)}" ${ro} aria-label="Nome">`;
    if(S.canWrite){
      h+=`<button class="btn sm" data-up="${lista}:${i}" ${i===0?'disabled':''} aria-label="Subir">↑</button>`;
      h+=`<button class="btn sm" data-tog="${lista}:${esc(x.id)}">${x.ativo?'Desativar':'Ativar'}</button>`;
      if(lista==='origens'&&itens.length>1)h+=`<select data-merge="${esc(x.id)}" aria-label="Juntar com"><option value="">Juntar com…</option>${itens.filter(o=>o.id!==x.id).map(o=>`<option value="${esc(o.id)}">${esc(o.nome)}</option>`).join('')}</select>`;
    }
    h+='</div>';});
  h+='</div>';
  if(S.canWrite)h+=`<div class="addrow"><input type="text" placeholder="Novo nome" data-addinp="${lista}"><button class="btn" data-add="${lista}">Adicionar</button></div>`;
  return h+'</div>';
}
function novoId(lista,nome){let id=slug(nome),i=2;const base=id;while((S.cfg[lista]||[]).some(x=>x.id===id))id=base+'_'+i++;return id;}
async function juntarOrigem(de,para){
  const a=S.cfg.origens.find(x=>x.id===de),b=S.cfg.origens.find(x=>x.id===para);if(!a||!b)return;
  if(!confirm(`Somar todo o histórico de “${a.nome}” em “${b.nome}” e remover “${a.nome}”?`))return;
  const keys=Object.keys(S.meses);
  for(const k of keys){const doc=S.meses[k];let mudou=false;
    Object.values(doc.dias||{}).forEach(r=>{if(r.o&&r.o[de]){r.o[para]=(r.o[para]||0)+r.o[de];delete r.o[de];mudou=true;}});
    if(doc.origensMes&&doc.origensMes[de]!=null){const v=doc.origensMes[de];delete doc.origensMes[de];if(v>0)doc.origensMes[para]=(doc.origensMes[para]||0)+v;mudou=true;}
    if(mudou){try{await S.db.doc('meses/'+k).set(clone(doc));}catch(e){toast('Falha ao juntar em '+mesNome(k)+'. Nada mais foi alterado.',5000);return;}}}
  b.aliases=Array.from(new Set([...(b.aliases||[]),a.nome,...(a.aliases||[])]));
  S.cfg.origens=S.cfg.origens.filter(x=>x.id!==de);
  await salvarCfg();render();
}

// ===== importação =====
async function lerArquivo(file){
  try{
    const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});
    const raw=parsePlanilha(XLSX,wb,hoje.getFullYear());
    S.importado={raw,arquivo:file.name,...mapearImport(raw,S.cfg)};
    renderPreviewImport();
  }catch(e){toast('Não consegui ler este arquivo. Confira se é a planilha .xlsx de receptivos.',5000);}
}
function mapearImport(raw,cfgIn){
  const cfg=clone(cfgIn);const novos={vendedores:[],origens:[]};
  const achar=(lista,nome)=>{const k=normTxt(nome);let it=cfg[lista].find(x=>normTxt(x.nome)===k||(x.aliases||[]).some(a=>normTxt(a)===k));
    if(!it){let id=slug(nome),i=2;const b=id;while(cfg[lista].some(x=>x.id===id))id=b+'_'+i++;it={id,nome:String(nome).trim(),ativo:true};cfg[lista].push(it);novos[lista].push(it.nome);}return it.id;};
  const docs={};
  Object.entries(raw.meses).forEach(([k,m])=>{
    (m.vendedores||[]).forEach(n=>achar('vendedores',n));
    const doc={dias:{},origensMes:{},comparativo:m.comparativo||null};
    Object.entries(m.dias).forEach(([d,r])=>{const o={};if(Object.keys(r.t).length)o.t={...r.t};if(Object.keys(r.v).length){o.v={};Object.entries(r.v).forEach(([n,v])=>{const id=achar('vendedores',n);o.v[id]=(o.v[id]||0)+v;});}doc.dias[d]=o;});
    Object.entries(m.origens).forEach(([n,v])=>{const id=achar('origens',n);if(v>0)doc.origensMes[id]=(doc.origensMes[id]||0)+v;});
    const c={t:0,ev:0,v:0};Object.values(doc.dias).forEach(r=>{Object.entries(r.t||{}).forEach(([id,n])=>{c.t+=n;if(id==='eventos')c.ev+=n;});Object.values(r.v||{}).forEach(n=>c.v+=n);});
    doc.eventosForaDaMeta=c.ev>0&&c.v<=c.t-c.ev;
    doc.resumo=c;docs[k]=doc;
  });
  return {cfg,docs,novos};
}
function renderPreviewImport(){
  const el=$('#imp-prev');if(!el||!S.importado)return;const I=S.importado;
  const ks=Object.keys(I.docs).sort();
  let h=`<div class="mt"><p><b>${esc(I.arquivo)}</b>: ${ks.length} mês(es) encontrados.</p>`;
  if(I.raw.avisos.length)h+='<div class="banner">'+I.raw.avisos.map(esc).join('<br>')+'</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Mês</th><th class="n">Total</th><th class="n">Distribuídos</th><th class="n">Alcançado</th><th class="n">Origens</th><th>Já lançado</th></tr></thead><tbody>';
  ks.forEach(k=>{const d=I.docs[k];const r=d.resumo;const base=d.eventosForaDaMeta?r.t-r.ev:r.t;const o=Object.values(d.origensMes).reduce((a,b)=>a+b,0);const ja=calcMes(k).total;
    h+=`<tr><td>${mesNome(k)}${d.eventosForaDaMeta?' <small style="color:var(--muted)">(eventos fora da meta)</small>':''}</td><td class="n">${fmt(r.t)}</td><td class="n">${fmt(r.v)}</td><td class="n">${base?pct(r.v/base):'—'}</td><td class="n">${fmt(o)}</td><td>${ja?'sim, '+fmt(ja)+' (será substituído)':'—'}</td></tr>`;});
  h+='</tbody></table></div>';
  if(I.novos.vendedores.length)h+=`<p class="note">Vendedores novos: ${I.novos.vendedores.map(esc).join(', ')}.</p>`;
  if(I.novos.origens.length)h+=`<p class="note">Origens novas: ${I.novos.origens.map(esc).join(', ')}.</p>`;
  h+=`<div class="fieldrow mt"><button class="btn pri" data-act="imp-ok">Importar e substituir esses meses</button><button class="btn" data-act="imp-cancel">Cancelar</button></div></div>`;
  el.innerHTML=h;
}
async function confirmarImport(){
  const I=S.importado;if(!I)return;
  const btn=document.querySelector('[data-act=imp-ok]');if(btn){btn.disabled=true;btn.textContent='Importando…';}
  try{
    S.cfg=normCfg(I.cfg);await S.db.doc('config/geral').set(clone(S.cfg));
    for(const [k,d] of Object.entries(I.docs)){const doc=clone(d);delete doc.resumo;const {y,m}=partsOf(k);Object.assign(doc,{ano:y,mes:m,arquivo:I.arquivo,atualizadoEm:new Date().toISOString()});S.meses[k]=doc;await S.db.doc('meses/'+k).set(doc);}

function criarDb(sb){
  const erroDe=error=>{const e=new Error(error.message);e.code=(error.code==='42501'||/row-level security/i.test(error.message||''))?'invalid_argument':(error.code||'erro');return e;};
  const docSnap=row=>({exists:!!row,id:row?row.id:null,data:()=>row?row.dados:undefined});
  return {
    doc(p){const [c,id]=p.split('/');return {
      async set(dados){const {error}=await sb.from('documentos').upsert({colecao:c,id,dados});if(error)throw erroDe(error);},
      onSnapshot(next,err){
        sb.from('documentos').select('id,dados').eq('colecao',c).eq('id',id).maybeSingle().then(({data,error})=>{if(error){err&&err(erroDe(error));return;}next(docSnap(data));});
        const ch=sb.channel('doc-'+c+'-'+id).on('postgres_changes',{event:'*',schema:'public',table:'documentos',filter:'colecao=eq.'+c},pl=>{
          if(pl.eventType==='DELETE'){if(pl.old&&pl.old.id===id)next(docSnap(null));return;}
          if(pl.new&&pl.new.id===id)next(docSnap(pl.new));}).subscribe();
        return ()=>sb.removeChannel(ch);}
    };},
    collection(c){return {onSnapshot(next,err){
      sb.from('documentos').select('id,dados').eq('colecao',c).then(({data,error})=>{if(error){err&&err(erroDe(error));return;}
        next({docChanges:()=>(data||[]).map(r=>({type:'added',doc:{id:r.id,data:()=>r.dados}}))});});
      const ch=sb.channel('col-'+c).on('postgres_changes',{event:'*',schema:'public',table:'documentos',filter:'colecao=eq.'+c},pl=>{
        if(pl.eventType==='DELETE'){const o=pl.old||{};if(o.colecao&&o.colecao!==c)return;next({docChanges:()=>[{type:'removed',doc:{id:o.id,data:()=>undefined}}]});return;}
        const r=pl.new;next({docChanges:()=>[{type:'modified',doc:{id:r.id,data:()=>r.dados}}]});}).subscribe();
      return ()=>sb.removeChannel(ch);}};}
  };
}
